<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natulib</title>
  <link rel="icon" type="image/png" href="/Natulib/assets/natulib.png">
  <!-- Charge le style officiel GitHub pour un rendu propre de vos notes  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <style>
    /* Le fond de la page entière */
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* Le conteneur parfaitement centré au milieu de l'écran */
    .page-container {
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto; /* C'est cette ligne qui centre le bloc horizontalement */
      padding: 45px;
    }
    @media (max-width: 767px) { .page-container { padding: 15px; } }

    /* Style du menu instantané sur une seule ligne */
    .simple-nav-container {
      margin: 20px 0 40px 0;
      padding-bottom: 15px;
      border-bottom: 1px solid #eaecef;
      display: flex;
      flex-wrap: nowrap;
      gap: 15px;
      justify-content: center;
      overflow-x: auto;
      white-space: nowrap;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .simple-nav-container::-webkit-scrollbar {
      display: none;
    }
    .simple-nav-link {
      color: #24292e;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none !important;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .simple-nav-link:hover, .simple-nav-link.active {
      color: #28a745;
      border-bottom: 2px solid #28a745;
    }
    /* Style du nouveau pied de page */
    .footer-links {
      margin-top: 60px;
      padding-top: 25px;
      border-top: 1px solid #eaecef;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: #57606a;
      font-size: 14px;
      text-decoration: none !important;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .footer-links a:hover {
      color: #28a745;
    }
  </style>
</head>
<body>

  <!-- Début du bloc centré -->
  <div class="page-container">

    <!-- Logo et Menu -->
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="/Natulib/assets/natulib.png" style="max-height: 100px; border-radius: 12px;" alt="Logo Natulib">
    </div>
    
    <div class="simple-nav-container">
      <a href="/Natulib/" class="simple-nav-link">🏠 Accueil</a>
      <a href="/Natulib/Installation.html" class="simple-nav-link">🚀 Installation</a>
      <a href="/Natulib/Modules.html" class="simple-nav-link">🧱 Modules</a>
      <a href="/Natulib/Projets.html" class="simple-nav-link">🏗️ Projets</a>
      <a href="/Natulib/Recettes.html" class="simple-nav-link">🌱 Recettes</a>
      <a href="/Natulib/Natulib-OS.html" class="simple-nav-link">🧠 Natulib OS</a>
      <a href="/Natulib/Contribuer.html" class="simple-nav-link">🤝 Contribuer</a>
      <a href="/Natulib/FAQ.html" class="simple-nav-link">❓ FAQ</a>
    </div>

    <!-- Application du style Markdown uniquement sur le texte des notes -->
    <div class="markdown-body">
      {{ content }}
    </div>
    
    <!-- Pied de page -->
    <div class="footer-links">
      <a href="https://discord.gg/3Xs3HmphJk" target="_blank">💬 Discord</a>
      <a href="https://www.youtube.com/@Natulib" target="_blank">🎥 YouTube</a>
      <a href="https://github.com/natulib/Natulib" target="_blank">🔗 GitHub</a>
    </div>

  </div>
  <!-- Fin du bloc centré -->

  <!-- Script pour souligner la page active en vert -->
  <script>
    var currentPath = window.location.pathname;
    if (currentPath === '/Natulib') currentPath = '/Natulib/';
    document.querySelectorAll('.simple-nav-link').forEach(function(link) {
      if (link.getAttribute('href') === currentPath) {
        link.classList.add('active');
      }
    });
  </script>
</body>
</html>
