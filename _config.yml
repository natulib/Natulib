# ------------------------------------------------------------------
# Natulib — configuration GitHub Pages
# Source Pages : /docs sur la branche main (voir Settings > Pages)
# ------------------------------------------------------------------
lang: fr

# Thème Just the Docs : navigation latérale, recherche intégrée,
# fil d'ariane — chargé à distance, aucune installation locale requise.
remote_theme: just-the-docs/just-the-docs

# URL propres, sans extension : docs/Modules.md -> /Modules/
# ATTENTION :  le réglage global "permalink:" ne s'applique qu'aux
# articles de blog Jekyll (_posts), jamais aux pages classiques.
# Pour des pages comme les nôtres, il faut passer par "defaults" avec
# type: "pages" ci-dessous — c'est lui qui fait réellement le travail.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      permalink: /:path/
      # Sans cette ligne, aucune page n'a de layout défini dans son
      # front  matter : jekyll-default-layout (activé par défaut sur
      # GitHub Pages) applique alors SON propre gabarit générique à
      # la place de celui de Just the Docs — d'où l'absence totale
      # de sidebar, recherche, et logo, quel que soit le réglage
      # "logo:" ci-dessus.
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_insensitive
heading_anchors: true
back_to_top: true
back_to_top_text: "Haut de page"

color_scheme: light

aux_links:
  "Code source":
    - "https://github.com/Natulib/Natulib"

footer_content: "Natulib — Plateforme ouverte et modulaire pour créer des systèmes autonomes au service du vivant."

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .obsidian/
