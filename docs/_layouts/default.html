<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natulib</title>
  <link rel="icon" type="image/png" href="/Natulib/assets/natulib.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .page-container {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) { .page-container { padding: 15px; } }

    /* Conteneur global du menu (permet d'ancrer les résultats de recherche) */
    .nav-wrapper {
      position: relative;
      margin: 20px 0 40px 0;
    }

    /* Navigation */
    .simple-nav-container {
      padding-bottom: 15px;
      border-bottom: 1px solid #eaecef;
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      justify-content: center;
      align-items: center; /* Centre la loupe avec le texte */
      overflow-x: auto;
      white-space: nowrap;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .simple-nav-container::-webkit-scrollbar { display: none; }
    
    .simple-nav-link {
      color: #24292e;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none !important;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .simple-nav-link:hover, .simple-nav-link.active {
      color: #28a745;
      border-bottom: 2px solid #28a745;
    }

    /* Loupe extensible */
    .inline-search-input {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 16px;
      background-color: transparent;
      font-size: 15px;
      color: #24292e;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
      text-align: center;
    }
    .inline-search-input::placeholder {
      color: #24292e;
    }
    .inline-search-input:focus, 
    .inline-search-input:not(:placeholder-shown) {
      width: 150px;
      background-color: #f6f8fa;
      border: 1px solid #eaecef;
      padding: 0 12px;
      text-align: left;
      cursor: text;
    }
    .inline-search-input:focus::placeholder {
      color: transparent; /* Cache la loupe quand on tape */
    }

    /* Résultats de recherche */
    .search-results {
      position: absolute;
      top: 100%;
      right: 0; /* Aligne la boîte à droite */
      width: 280px;
      max-width: 100%;
      background: #ffffff;
      border: 1px solid #eaecef;
      border-radius: 8px;
      margin-top: -10px; /* Remonte un peu sous la ligne */
      padding: 0;
      list-style: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 100;
      display: none;
      text-align: left;
      overflow: hidden;
    }
    .search-results li a {
      display: block;
      padding: 12px 18px;
      color: #24292e;
      text-decoration: none;
      border-bottom: 1px solid #f6f8fa;
      white-space: normal; /* Permet au titre de revenir à la ligne si trop long */
      line-height: 1.4;
    }
    .search-results li a:hover {
      background-color: #f6f8fa;
      color: #28a745;
    }
    .search-results li:last-child a { border-bottom: none; }

    /* Pied de page */
    .footer-links {
      margin-top: 60px;
      padding-top: 25px;
      border-top: 1px solid #eaecef;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: #57606a;
      font-size: 14px;
      text-decoration: none !important;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: #28a745; }
  </style>
</head>
<body>

  <div class="page-container">

    <!-- En-tête -->
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="/Natulib/assets/natulib.png" style="max-height: 100px; border-radius: 12px;" alt="Logo Natulib">
    </div>
    
    <!-- Wrapper du menu et de la recherche -->
    <div class="nav-wrapper">
      <div class="simple-nav-container">
        <a href="/Natulib/" class="simple-nav-link">🏠 Accueil</a>
        <a href="/Natulib/Installation.html" class="simple-nav-link">🚀 Installation</a>
        <a href="/Natulib/Modules.html" class="simple-nav-link">🧱 Modules</a>
        <a href="/Natulib/Projets.html" class="simple-nav-link">🏗️ Projets</a>
        <a href="/Natulib/Recettes.html" class="simple-nav-link">🌱 Recettes</a>
        <a href="/Natulib/Natulib-OS.html" class="simple-nav-link">🧠 Natulib OS</a>
        <a href="/Natulib/Contribuer.html" class="simple-nav-link">🤝 Contribuer</a>
        <a href="/Natulib/FAQ.html" class="simple-nav-link">❓ FAQ</a>
        
        <!-- La loupe discrète -->
        <input type="text" id="search-input" class="inline-search-input" placeholder="🔍">
      </div>
      <!-- La liste de résultats (en dehors du menu défilant) -->
      <ul id="results-container" class="search-results"></ul>
    </div>

    <!-- Contenu Markdown -->
    <div class="markdown-body">
      {{ content }}
    </div>

    <!-- Pied de page -->
    <div class="footer-links">
      <a href="https://discord.gg/3Xs3HmphJk" target="_blank">💬 Discord</a>
      <a href="https://www.youtube.com/@Natulib" target="_blank">🎥 YouTube</a>
      <a href="https://github.com/natulib/Natulib" target="_blank">🔗 GitHub</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
  <script>
    // Soulignement
    var currentPath = window.location.pathname;
    if (currentPath === '/Natulib') currentPath = '/Natulib/';
    document.querySelectorAll('.simple-nav-link').forEach(function(link) {
      if (link.getAttribute('href') === currentPath) {
        link.classList.add('active');
      }
    });

    // Recherche
    var sjs = SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('results-container'),
      json: '/Natulib/search.json',
      searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
      noResultsText: '<li style="padding: 12px 18px; color: #57606a;">Aucun résultat</li>'
    });

    var searchInput = document.getElementById('search-input');
    var resultsContainer = document.getElementById('results-container');
    
    searchInput.addEventListener('input', function() {
      resultsContainer.style.display = this.value.length > 0 ? 'block' : 'none';
    });
    
    document.addEventListener('click', function(e) {
      if (e.target !== searchInput) {
        resultsContainer.style.display = 'none';
      } else if (searchInput.value.length > 0) {
        resultsContainer.style.display = 'block';
      }
    });
  </script>
</body>
</html>
