<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}Natulib</title>
  <link rel="icon" type="image/png" href="/Natulib/assets/natulib.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <link rel="stylesheet" href="/Natulib/assets/_layouts/site.css">
</head>
<body>

  {% include header.html %}

  <main id="contenu" class="page-container">
    <article class="markdown-body">
      {{ content }}
    </article>
  </main>

  {% include footer.html %}

</body>
</html>
