<style>
  /* 1. Masque INSTANTANÉMENT le titre H1 (Natulib) */
  .markdown-body > h1:first-of-type { 
    display: none !important; 
  }

  /* 2. Menu épuré et aligné */
  .simple-nav-container {
    margin: 20px 0 40px 0;
    padding-bottom: 15px;
    border-bottom: 1px solid #eaecef; /* Petite ligne grise discrète pour délimiter l'en-tête */
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center; /* Centre parfaitement tous les liens */
  }
  
  .simple-nav-link {
    color: #24292e;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none !important;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent; /* Bordure invisible par défaut */
    transition: all 0.2s ease;
  }
  
  /* Soulignement vert au survol et pour la page active */
  .simple-nav-link:hover,
  .simple-nav-link.active {
    color: #28a745;
    border-bottom: 2px solid #28a745;
  }
</style>

<!-- Favicon pour l'onglet du navigateur -->
<link rel="icon" type="image/png" href="/Natulib/assets/natulib.png">

<!-- 3. Injection du logo et du menu texte -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var markdownBody = document.querySelector('.markdown-body');
    if (!markdownBody) return;

    var headerHTML = `
      <div style="text-align: center; margin-bottom: 30px;">
        <img src="/Natulib/assets/natulib.png" style="max-height: 100px; border-radius: 12px;" alt="Logo Natulib">
      </div>
      <div class="simple-nav-container">
        <a href="/Natulib/" class="simple-nav-link">🏠 Accueil</a>
        <a href="/Natulib/Installation.html" class="simple-nav-link">🚀 Installation</a>
        <a href="/Natulib/Modules.html" class="simple-nav-link">🧱 Modules</a>
        <a href="/Natulib/Projets.html" class="simple-nav-link">🏗️ Projets</a>
        <a href="/Natulib/Recettes.html" class="simple-nav-link">🌱 Recettes</a>
        <a href="/Natulib/Natulib-OS.html" class="simple-nav-link">🧠 Natulib OS</a>
        <a href="/Natulib/Contribuer.html" class="simple-nav-link">🤝 Contribuer</a>
        <a href="/Natulib/FAQ.html" class="simple-nav-link">❓ FAQ</a>
        <a href="https://github.com/natulib/Natulib" class="simple-nav-link" target="_blank">🔗 GitHub</a>
      </div>
    `;
    
    markdownBody.insertAdjacentHTML('afterbegin', headerHTML);

    // 4. Détecter la page actuelle pour souligner le bon menu en vert
    var currentPath = window.location.pathname;
    // Gérer l'URL racine au cas où il manque le slash final
    if (currentPath === '/Natulib') currentPath = '/Natulib/';
    
    var links = document.querySelectorAll('.simple-nav-link');
    links.forEach(function(link) {
      if (link.getAttribute('href') === currentPath) {
        link.classList.add('active');
      }
    });
  });
</script>
