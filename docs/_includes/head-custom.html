<style>
  /* Style des onglets imitant l'interface ESP / Natulib OS */
  .nav-tabs-container {
    margin: 20px 0 30px 0;
    padding-bottom: 10px;
    overflow-x: auto; /* Permet le défilement horizontal sur mobile */
  }
  .nav-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .tab-btn {
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none !important;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: #e5e7eb;
    border-color: #9ca3af;
    color: #111827;
  }
</style>

<!-- Favicon pour l'onglet du navigateur -->
<link rel="icon" type="image/jpeg" href="/Natulib/assets/logo.jpeg">

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var markdownBody = document.querySelector('.markdown-body');
    if (!markdownBody) return;

    // 1. Chercher et masquer explicitement le titre par défaut généré par GitHub
    var allH1s = markdownBody.querySelectorAll('h1');
    allH1s.forEach(function(h1) {
        if (h1.textContent.trim() === "Natulib") {
            h1.style.display = "none";
        }
    });

    // 2. Injecter le logo et le menu au format onglets ESP
    var headerHTML = `
      <div style="text-align: center; margin-bottom: 25px;">
        <img src="/Natulib/assets/logo.jpeg" style="max-height: 120px; border-radius: 12px;" alt="Logo Natulib">
      </div>
      <div class="nav-tabs-container">
        <div class="nav-tabs">
          <a href="/Natulib/" class="tab-btn">🏠 Accueil</a>
          <a href="/Natulib/Installation.html" class="tab-btn">🚀 Installation</a>
          <a href="/Natulib/Modules.html" class="tab-btn">🧱 Modules</a>
          <a href="/Natulib/Projets.html" class="tab-btn">🏗️ Projets</a>
          <a href="/Natulib/Recettes.html" class="tab-btn">🌱 Recettes</a>
          <a href="/Natulib/Natulib-OS.html" class="tab-btn">🧠 Natulib OS</a>
          <a href="/Natulib/Contribuer.html" class="tab-btn">🤝 Contribuer</a>
          <a href="/Natulib/FAQ.html" class="tab-btn">❓ FAQ</a>
          <a href="https://github.com/natulib/Natulib" class="tab-btn" target="_blank">🔗 GitHub</a>
        </div>
      </div>
    `;
    
    // Insertion de notre bloc tout en haut de la page
    markdownBody.insertAdjacentHTML('afterbegin', headerHTML);
  });
</script>
